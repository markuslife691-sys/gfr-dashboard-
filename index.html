<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RecordBook | Financial Records</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.js"></script>
<style>
    :root {
        --bg: #0A0A0B;
        --surface: #131316;
        --border: rgba(255,255,255,0.08);
        --border-hover: rgba(255,255,255,0.15);
        --text: #FAFAFA;
        --text-muted: #71717A;
        --accent: #3B82F6;
        --green: #10B981;
        --red: #EF4444;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: 'Inter', sans-serif;
        background: var(--bg);
        color: var(--text);
        font-size: 13px;
        line-height: 1.4;
        padding: 16px;
    }
    .app {
        max-width: 1200px;
        margin: 0 auto;
        display: grid;
        gap: 16px;
    }
    .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 8px;
    }
    .logo {
        font-size: 16px;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 8px;
    }
    .logo-dot {
        width: 6px;
        height: 6px;
        background: var(--accent);
        border-radius: 50%;
    }
    .stats {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
    }
    .stat-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 12px;
    }
    .stat-label {
        font-size: 11px;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }
    .stat-value {
        font-size: 20px;
        font-weight: 600;
        margin-top: 4px;
    }
    .main-grid {
        display: grid;
        grid-template-columns: 320px 1fr;
        gap: 16px;
    }
    .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 16px;
    }
    .card-title {
        font-size: 12px;
        font-weight: 600;
        margin-bottom: 12px;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }
    .form-group { margin-bottom: 12px; }
    label {
        display: block;
        font-size: 11px;
        color: var(--text-muted);
        margin-bottom: 4px;
    }
    input, select {
        width: 100%;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 8px 10px;
        color: var(--text);
        font-family: inherit;
        font-size: 13px;
    }
    input:focus, select:focus {
        outline: none;
        border-color: var(--accent);
    }
    .btn {
        background: var(--accent);
        border: none;
        color: white;
        padding: 9px 12px;
        border-radius: 6px;
        cursor: pointer;
        font-family: inherit;
        font-size: 13px;
        font-weight: 500;
        width: 100%;
        transition: opacity 0.15s;
    }
    .btn:hover { opacity: 0.9; }
    .btn-secondary {
        background: var(--bg);
        border: 1px solid var(--border);
        color: var(--text);
        margin-top: 8px;
    }
    .toolbar {
        display: flex;
        gap: 8px;
        margin-bottom: 12px;
    }
    .search {
        flex: 1;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 8px 10px;
        color: var(--text);
        font-size: 13px;
    }
    table {
        width: 100%;
        border-collapse: collapse;
    }
    th {
        text-align: left;
        font-size: 11px;
        color: var(--text-muted);
        font-weight: 500;
        padding: 8px 4px;
        border-bottom: 1px solid var(--border);
        text-transform: uppercase;
    }
    td {
        padding: 10px 4px;
        border-bottom: 1px solid var(--border);
        font-size: 13px;
    }
    tr:hover { background: rgba(255,255,255,0.02); }
    .profit { color: var(--green); }
    .loss { color: var(--red); }
    .action-btn {
        background: none;
        border: none;
        color: var(--text-muted);
        cursor: pointer;
        padding: 4px;
    }
    .action-btn:hover { color: var(--text); }
    .modal {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.7);
        align-items: center;
        justify-content: center;
        z-index: 100;
    }
    .modal.active { display: flex; }
    .modal-content {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 20px;
        width: 360px;
    }
    .empty {
        text-align: center;
        padding: 40px 0;
        color: var(--text-muted);
        font-size: 13px;
    }
    @media (max-width: 900px) {
        .main-grid { grid-template-columns: 1fr; }
        .stats { grid-template-columns: repeat(2, 1fr); }
    }
</style>
</head>
<body>
    <div class="app">
        <div class="header">
            <div class="logo">
                <span class="logo-dot"></span>
                RecordBook
            </div>
            <button class="action-btn" onclick="openSettings()"><i data-lucide="settings" style="width:18px;height:18px;"></i></button>
        </div>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-label">Total Revenue</div>
                <div class="stat-value" id="totalRevenue">$0.00</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Total Cost</div>
                <div class="stat-value" id="totalCost">$0.00</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Net Profit</div>
                <div class="stat-value" id="netProfit">$0.00</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Products</div>
                <div class="stat-value" id="totalProducts">0</div>
            </div>
        </div>

        <div class="main-grid">
            <div class="card">
                <div class="card-title">Add Product Record</div>
                <form id="productForm">
                    <div class="form-group">
                        <label>Product Name</label>
                        <input type="text" id="productName" required>
                    </div>
                    <div class="form-group">
                        <label>Category</label>
                        <select id="productCategory">
                            <option>Electronics</option>
                            <option>Clothing</option>
                            <option>Food</option>
                            <option>Services</option>
                            <option>Other</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Cost Price</label>
                        <input type="number" id="costPrice" step="0.01" required>
                    </div>
                    <div class="form-group">
                        <label>Selling Price</label>
                        <input type="number" id="sellPrice" step="0.01" required>
                    </div>
                    <div class="form-group">
                        <label>Quantity Sold</label>
                        <input type="number" id="quantity" value="1" min="1" required>
                    </div>
                    <div class="form-group">
                        <label>Date</label>
                        <input type="date" id="date" required>
                    </div>
                    <button type="submit" class="btn">Save Record</button>
                    <button type="button" class="btn btn-secondary" onclick="exportCSV()">Export CSV</button>
                </form>
            </div>

            <div class="card">
                <div class="card-title">Activity Log</div>
                <div class="toolbar">
                    <input type="text" class="search" placeholder="Search products..." id="searchBox">
                </div>
                <div style="overflow-x:auto;">
                    <table id="recordsTable">
                        <thead>
                            <tr>
                                <th>Product</th>
                                <th>Category</th>
                                <th>Qty</th>
                                <th>Cost</th>
                                <th>Revenue</th>
                                <th>Profit</th>
                                <th>Date</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody id="recordsBody">
                        </tbody>
                    </table>
                    <div class="empty" id="emptyState">No records yet. Add your first product.</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
                <h3 style="font-size:14px;">Settings</h3>
                <button class="action-btn" onclick="closeSettings()"><i data-lucide="x" style="width:16px;height:16px;"></i></button>
            </div>
            <div style="margin-bottom:12px;">
                <label>Currency Symbol</label>
                <select id="currencySelect" onchange="updateCurrency()">
                    <option value="$">$ USD</option>
                    <option value="€">€ EUR</option>
                    <option value="£">£ GBP</option>
                    <option value="₦">₦ NGN</option>
                </select>
            </div>
            <button class="btn btn-secondary" onclick="clearAllData()">Clear All Data</button>
        </div>
    </div>

<script>
    lucide.createIcons();
    let records = JSON.parse(localStorage.getItem('financialRecords')) || [];
    let currency = localStorage.getItem('currency') || '$';
    document.getElementById('currencySelect').value = currency;
    document.getElementById('date').valueAsDate = new Date();

    function saveRecords() {
        localStorage.setItem('financialRecords', JSON.stringify(records));
        renderTable();
        updateStats();
    }

    function renderTable() {
        const tbody = document.getElementById('recordsBody');
        const search = document.getElementById('searchBox').value.toLowerCase();
        const filtered = records.filter(r => r.name.toLowerCase().includes(search));
        
        tbody.innerHTML = '';
        document.getElementById('emptyState').style.display = filtered.length ? 'none' : 'block';
        
        filtered.forEach((r, i) => {
            const profit = (r.sellPrice - r.costPrice) * r.qty;
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${r.name}</td>
                <td>${r.category}</td>
                <td>${r.qty}</td>
                <td>${currency}${(r.costPrice * r.qty).toFixed(2)}</td>
                <td>${currency}${(r.sellPrice * r.qty).toFixed(2)}</td>
                <td class="${profit >= 0 ? 'profit' : 'loss'}">${currency}${profit.toFixed(2)}</td>
                <td>${r.date}</td>
                <td>
                    <button class="action-btn" onclick="deleteRecord(${i})"><i data-lucide="trash-2" style="width:14px;height:14px;"></i></button>
                </td>
            `;
            tbody.appendChild(row);
        });
        lucide.createIcons();
    }

    function updateStats() {
        const totalRev = records.reduce((sum, r) => sum + r.sellPrice * r.qty, 0);
        const totalCost = records.reduce((sum, r) => sum + r.costPrice * r.qty, 0);
        const profit = totalRev - totalCost;
        
        document.getElementById('totalRevenue').textContent = `${currency}${totalRev.toFixed(2)}`;
        document.getElementById('totalCost').textContent = `${currency}${totalCost.toFixed(2)}`;
        document.getElementById('netProfit').textContent = `${currency}${profit.toFixed(2)}`;
        document.getElementById('netProfit').style.color = profit >= 0 ? 'var(--green)' : 'var(--red)';
        document.getElementById('totalProducts').textContent = records.length;
    }

    document.getElementById('productForm').onsubmit = (e) => {
        e.preventDefault();
        const record = {
            name: document.getElementById('productName').value,
            category: document.getElementById('productCategory').value,
            costPrice: parseFloat(document.getElementById('costPrice').value),
            sellPrice: parseFloat(document.getElementById('sellPrice').value),
            qty: parseInt(document.getElementById('quantity').value),
            date: document.getElementById('date').value
        };
        records.unshift(record);
        saveRecords();
        e.target.reset();
        document.getElementById('date').valueAsDate = new Date();
        document.getElementById('quantity').value = 1;
    };

    function deleteRecord(index) {
        if (confirm('Delete this record?')) {
            records.splice(index, 1);
            saveRecords();
        }
    }

    function exportCSV() {
        if (!records.length) return alert('No records to export');
        const headers = 'Product,Category,Qty,Cost Price,Sell Price,Profit,Date\n';
        const rows = records.map(r => 
            `"${r.name}",${r.category},${r.qty},${r.costPrice},${r.sellPrice},${((r.sellPrice-r.costPrice)*r.qty).toFixed(2)},${r.date}`
        ).join('\n');
        const blob = new Blob([headers + rows], { type: 'text/csv' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'financial_records.csv';
        a.click();
    }

    function openSettings() {
        document.getElementById('settingsModal').classList.add('active');
    }

    function closeSettings() {
        document.getElementById('settingsModal').classList.remove('active');
    }

    function updateCurrency() {
        currency = document.getElementById('currencySelect').value;
        localStorage.setItem('currency', currency);
        updateStats();
        renderTable();
    }

    function clearAllData() {
        if (confirm('This will delete ALL records. Continue?')) {
            records = [];
            saveRecords();
            closeSettings();
        }
    }

    document.getElementById('searchBox').oninput = renderTable;
    
    // Init
    renderTable();
    updateStats();
</script>
</body>
</html>
